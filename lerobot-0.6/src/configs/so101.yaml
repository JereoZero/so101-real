# SO-101 robot configuration.
# For LeRobot v0.6.0.
#
# Current hardware mapping (2026-07-20):
#   - Leader arm (主臂):  /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B3E121553-if00
#   - Follower arm (从臂): /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B3E121987-if00
#   - Front camera (爪子视角):
#       /dev/v4l/by-id/usb-icSpring_icspring_camera-video-index0
#       -> /dev/video0, YUYV, 640x480@30
#   - Top camera (顶部第三视角):
#       /dev/v4l/by-id/usb-icSpring_icspring_camera_202404160005-video-index0
#       -> /dev/video2, MJPG, 640x480@30
#
# Confirmed by unplugging the leader arm: when leader USB is removed,
# /dev/ttyACM1 (serial 5B3E121553) disappears, so it is the leader arm.

robot:
  type: so101_follower
  port: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B3E121987-if00
  id: j_follower
  # Fix wrist_roll (gripper rotation joint) to a constant angle, matching the reference project.
  # Value is in degrees because use_degrees=true.
  fixed_joints:
    wrist_roll: -27.82

teleop:
  type: so101_leader
  port: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B3E121553-if00
  id: j_leader

# Camera configuration matching the reference project:
# front = gripper/claw view (YUYV), top = third-person view (MJPG)
cameras:
  front:
    type: opencv
    index_or_path: /dev/v4l/by-id/usb-icSpring_icspring_camera-video-index0
    fps: 30
    width: 640
    height: 480
    fourcc: YUYV
  top:
    type: opencv
    index_or_path: /dev/v4l/by-id/usb-icSpring_icspring_camera_202404160005-video-index0
    fps: 30
    width: 640
    height: 480
    fourcc: MJPG
